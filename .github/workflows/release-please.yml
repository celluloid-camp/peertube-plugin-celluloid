name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      # Node 24 ships npm >= 11.5.1 required for OIDC trusted publishing.
      # Do not set NODE_AUTH_TOKEN — an empty value blocks OIDC fallback.
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Typecheck
        if: ${{ steps.release.outputs.release_created }}
        run: npm run typecheck

      # Publishes via npm Trusted Publishing (OIDC). Provenance is automatic.
      # Trusted publisher on npmjs.com must use workflow filename: release-please.yml
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --access public
